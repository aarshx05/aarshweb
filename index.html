<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start -->
    <!-- Everything between these markers is replaced at build time by scripts/prerender.mjs
         (full meta, Open Graph, rel="me" and schema.org JSON-LD generated from content.json).
         What is here is only the fallback for `npm run dev`. -->
    <title>Aarsh Chaurasia | AI Security Engineer & Researcher</title>
    <meta name="description" content="Aarsh Chaurasia, AI Security Engineer." />
    <link rel="canonical" href="https://aarshc.me/" />
    <!-- seo:end -->

    <meta name="theme-color" content="#f3f0ea" />
    <meta name="color-scheme" content="light dark" />

    <!-- Paint the right theme before first render: the visitor's saved choice, otherwise light. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('aarsh-theme-v2');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0e0f0e' : '#f3f0ea');
      })();
    </script>


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Readable styling for the prerendered content (crawlers / no-JS visitors); React replaces it on load. -->
    <style>.prerendered{max-width:760px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.55}</style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
