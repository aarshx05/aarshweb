    <meta name="theme-color" content="#f3f0ea" />
    <meta name="color-scheme" content="light dark" />

    <!-- Paint the right theme before first render: the visitor's saved choice, otherwise light. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('aarsh-theme-v2');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0e0f0e' : '#f3f0ea');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
